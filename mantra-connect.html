<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mala Mantra</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #111411;
      --deep: #171d1a;
      --panel: rgba(32, 36, 29, 0.86);
      --panel-strong: rgba(45, 38, 27, 0.92);
      --paper: #fff3d6;
      --muted: #d6c79f;
      --line: rgba(255, 243, 214, 0.18);
      --line-strong: rgba(255, 243, 214, 0.36);
      --gold: #f2b33d;
      --teal: #37b7aa;
      --rose: #dc5e74;
      --leaf: #83b95e;
      --indigo: #465979;
      --clay: #c96f49;
      --focus: #fff1a3;
      --shadow: rgba(0, 0, 0, 0.36);
      --connect-board-size: clamp(320px, 44vw, 480px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      background:
        linear-gradient(115deg, rgba(242, 179, 61, 0.1), transparent 34%),
        linear-gradient(245deg, rgba(55, 183, 170, 0.11), transparent 36%),
        linear-gradient(180deg, #111411 0%, #172018 46%, #231a14 100%);
      color: var(--paper);
      font-family: "Avenir Next", "Noto Sans Devanagari", "Mangal", "Kohinoor Devanagari", Verdana, sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      background-image:
        linear-gradient(rgba(255, 243, 214, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 243, 214, 0.03) 1px, transparent 1px),
        repeating-conic-gradient(from 0deg at 50% 50%, rgba(242, 179, 61, 0.09) 0deg 4deg, transparent 4deg 12deg);
      background-size: 44px 44px, 44px 44px, 720px 720px;
      opacity: 0.7;
      mask-image: linear-gradient(to bottom, transparent, #000 14%, #000 86%, transparent);
    }

    button {
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(1360px, 100%);
      min-height: 100svh;
      margin: 0 auto;
      padding: 22px;
    }

    .mandala-asset {
      position: fixed;
      right: -130px;
      bottom: -150px;
      z-index: -1;
      width: 660px;
      max-width: 62vw;
      min-width: 360px;
      color: var(--gold);
      opacity: 0.18;
      pointer-events: none;
      transform: rotate(-8deg);
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      gap: 16px;
      align-items: center;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      width: 72px;
      height: 72px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid rgba(242, 179, 61, 0.5);
      border-radius: 50%;
      background:
        conic-gradient(from 20deg, rgba(242, 179, 61, 0.16), rgba(55, 183, 170, 0.15), rgba(220, 94, 116, 0.13), rgba(242, 179, 61, 0.16)),
        rgba(17, 20, 17, 0.62);
      box-shadow: 0 22px 44px rgba(0, 0, 0, 0.22);
      color: var(--gold);
      font-family: Georgia, "Noto Serif Devanagari", "Kohinoor Devanagari", serif;
      font-size: 1.72rem;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 4px;
      font-family: Georgia, "Noto Serif Devanagari", "Kohinoor Devanagari", serif;
      font-size: 3.4rem;
      line-height: 0.98;
      letter-spacing: 0;
    }

    .target-line {
      display: flex;
      gap: 10px;
      align-items: center;
      min-width: 0;
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 700;
    }

    .target-pill {
      color: #17130a;
      border-radius: 8px;
      padding: 6px 11px;
      background: linear-gradient(135deg, var(--gold), #ffe38a);
      box-shadow: 0 12px 24px rgba(242, 179, 61, 0.18);
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .icon-button,
    .mode-button,
    .reset-button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 243, 214, 0.075);
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.16);
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    .icon-button:hover,
    .mode-button:hover,
    .reset-button:hover {
      transform: translateY(-1px);
      border-color: var(--line-strong);
      background: rgba(255, 243, 214, 0.13);
    }

    .icon-button:focus-visible,
    .mode-button:focus-visible,
    .reset-button:focus-visible,
    .tile:focus-visible,
    .river-token:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .icon-button {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      padding: 0;
    }

    .icon-button svg,
    .mode-button svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .layout {
      display: grid;
      grid-template-columns: 282px minmax(0, 1fr) 244px;
      gap: 18px;
      align-items: stretch;
    }

    .panel,
    .stage {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, var(--panel), rgba(18, 22, 17, 0.82));
      box-shadow: 0 26px 70px var(--shadow);
      backdrop-filter: blur(18px);
    }

    .panel {
      min-width: 0;
      padding: 16px;
    }

    .mala-panel {
      display: grid;
      align-content: start;
      gap: 16px;
    }

    .mala-orbit {
      position: relative;
      width: 232px;
      max-width: 100%;
      aspect-ratio: 1;
      margin: 0 auto;
    }

    .mala-orbit::before,
    .mala-orbit::after {
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(242, 179, 61, 0.3);
      border-radius: 50%;
      content: "";
    }

    .mala-orbit::after {
      inset: 46px;
      border-color: rgba(55, 183, 170, 0.28);
    }

    .mala-beads {
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .mala-beads span {
      position: absolute;
      left: calc(50% - 4px);
      top: calc(50% - 4px);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 243, 214, 0.2);
      box-shadow: 0 0 0 1px rgba(255, 243, 214, 0.06);
      transform: rotate(calc(var(--i) * 10deg)) translateY(-105px);
      transform-origin: 4px 4px;
      transition: background 180ms ease, box-shadow 180ms ease, transform 180ms ease;
    }

    .mala-beads span.active {
      background: var(--gold);
      box-shadow: 0 0 18px rgba(242, 179, 61, 0.55);
      transform: rotate(calc(var(--i) * 10deg)) translateY(-105px) scale(1.16);
    }

    .mala-center {
      position: absolute;
      inset: 54px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 243, 214, 0.14);
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(242, 179, 61, 0.16), transparent 62%),
        rgba(17, 20, 17, 0.84);
      text-align: center;
    }

    .mala-count {
      color: var(--paper);
      font-family: Georgia, "Noto Serif Devanagari", "Kohinoor Devanagari", serif;
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1;
    }

    .mala-label {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .stat-stack {
      display: grid;
      gap: 11px;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 800;
    }

    .stat-row strong {
      color: var(--paper);
      font-size: 1rem;
    }

    .meter {
      height: 9px;
      overflow: hidden;
      border: 1px solid rgba(255, 243, 214, 0.11);
      border-radius: 999px;
      background: rgba(255, 243, 214, 0.08);
    }

    .meter span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--teal), var(--gold), var(--rose));
      transition: width 180ms ease;
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .mode-button {
      display: flex;
      min-width: 0;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 10px;
      color: var(--muted);
      font-weight: 900;
    }

    .mode-button.active {
      color: #15120c;
      border-color: rgba(255, 241, 163, 0.54);
      background: linear-gradient(135deg, var(--gold), #ffe189);
      box-shadow: 0 16px 34px rgba(242, 179, 61, 0.22);
    }

    .stage {
      position: relative;
      min-height: 650px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 243, 214, 0.07), transparent 30%),
        linear-gradient(135deg, rgba(70, 89, 121, 0.26), transparent 36%),
        linear-gradient(315deg, rgba(201, 111, 73, 0.16), transparent 42%),
        rgba(18, 22, 17, 0.86);
    }

    .stage::before {
      position: absolute;
      inset: 18px;
      pointer-events: none;
      border: 1px solid rgba(255, 243, 214, 0.09);
      border-radius: 8px;
      content: "";
    }

    .connect-stage,
    .river-stage {
      position: absolute;
      inset: 0;
    }

    .connect-stage {
      display: grid;
      place-items: center;
      padding: clamp(14px, 2.2vw, 24px);
    }

    .grid-wrap {
      position: relative;
      width: min(100%, var(--connect-board-size));
      aspect-ratio: 1;
    }

    .path-svg {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: visible;
      pointer-events: none;
    }

    .path-glow {
      fill: none;
      stroke: rgba(242, 179, 61, 0.28);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 22;
    }

    .path-line {
      fill: none;
      stroke: var(--gold);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 7;
    }

    .tile-grid {
      position: relative;
      z-index: 3;
      display: grid;
      width: 100%;
      height: 100%;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(8px, 1.2vw, 12px);
      touch-action: none;
      user-select: none;
    }

    .tile {
      display: grid;
      min-width: 0;
      min-height: 0;
      place-items: center;
      border: 1px solid rgba(255, 243, 214, 0.2);
      border-radius: 8px;
      background:
        linear-gradient(145deg, rgba(255, 243, 214, 0.14), rgba(255, 243, 214, 0.035)),
        rgba(20, 25, 19, 0.84);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 18px 28px rgba(0, 0, 0, 0.22);
      color: var(--paper);
      font-family: Georgia, "Noto Serif Devanagari", "Kohinoor Devanagari", serif;
      font-size: clamp(1.35rem, 2.8vw, 2.65rem);
      font-weight: 800;
      line-height: 1;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease, box-shadow 120ms ease;
    }

    .tile:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 243, 214, 0.34);
      background:
        linear-gradient(145deg, rgba(242, 179, 61, 0.16), rgba(55, 183, 170, 0.08)),
        rgba(20, 25, 19, 0.88);
    }

    .tile.selected {
      color: #19140a;
      border-color: rgba(255, 241, 163, 0.72);
      background: linear-gradient(135deg, var(--gold), #ffe38f);
      box-shadow: 0 0 0 3px rgba(242, 179, 61, 0.16), 0 20px 34px rgba(242, 179, 61, 0.18);
      transform: translateY(-2px) scale(1.02);
    }

    .tile.right {
      background: linear-gradient(135deg, var(--teal), #b7ead8);
    }

    .tile.wrong {
      color: #fff8ea;
      background: linear-gradient(135deg, var(--rose), #e77f67);
      animation: nudge 180ms ease both;
    }

    .river-stage {
      display: none;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(55, 183, 170, calc(0.08 + var(--calm, 42) * 0.001)), transparent 52%),
        linear-gradient(90deg, rgba(70, 89, 121, 0.18), rgba(131, 185, 94, 0.12), rgba(242, 179, 61, 0.1));
    }

    [data-mode="river"] .connect-stage {
      display: none;
    }

    [data-mode="river"] .river-stage {
      display: block;
    }

    .river-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      color: rgba(255, 243, 214, 0.2);
      pointer-events: none;
    }

    .river-art path {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-width: 2;
    }

    .river-token {
      position: absolute;
      z-index: 4;
      left: -48px;
      top: 0;
      touch-action: manipulation;
      user-select: none;
      min-width: 74px;
      min-height: 44px;
      border: 1px solid rgba(255, 243, 214, 0.22);
      border-radius: 8px;
      padding: 7px 12px 8px;
      background: rgba(19, 24, 21, 0.86);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.24);
      color: var(--paper);
      font-family: Georgia, "Noto Serif Devanagari", "Kohinoor Devanagari", serif;
      font-size: 1.38rem;
      font-weight: 800;
      line-height: 1;
      will-change: transform, opacity;
    }

    .river-token::before {
      position: absolute;
      inset: -10px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.001);
      content: "";
    }

    .river-token.target {
      border-color: rgba(242, 179, 61, 0.58);
      background: linear-gradient(135deg, rgba(242, 179, 61, 0.27), rgba(19, 24, 21, 0.86));
    }

    .river-token.caught {
      pointer-events: none;
      background: linear-gradient(135deg, var(--teal), #d3f3e9);
      color: #101411;
      opacity: 0;
      transform: scale(1.3);
      transition: opacity 260ms ease, transform 260ms ease;
    }

    .river-token.missed {
      pointer-events: none;
      background: linear-gradient(135deg, var(--rose), var(--clay));
      opacity: 0;
      transition: opacity 240ms ease;
    }

    .side-panel {
      display: grid;
      align-content: start;
      gap: 14px;
    }

    .mantra-card {
      display: grid;
      min-height: 150px;
      place-items: center;
      border: 1px solid rgba(255, 243, 214, 0.12);
      border-radius: 8px;
      background:
        conic-gradient(from 30deg, rgba(242, 179, 61, 0.15), rgba(55, 183, 170, 0.13), rgba(220, 94, 116, 0.1), rgba(242, 179, 61, 0.15)),
        rgba(17, 20, 17, 0.55);
      font-family: Georgia, "Noto Serif Devanagari", "Kohinoor Devanagari", serif;
      font-size: 3rem;
      font-weight: 900;
      text-align: center;
    }

    .mini-stats {
      display: grid;
      gap: 10px;
    }

    .mini-stat {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid rgba(255, 243, 214, 0.1);
      padding-top: 10px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 800;
    }

    .mini-stat strong {
      color: var(--paper);
      font-size: 1.08rem;
    }

    .reset-button {
      min-height: 46px;
      width: 100%;
      padding: 9px 12px;
      color: var(--paper);
      font-weight: 900;
    }

    .burst-layer {
      position: absolute;
      inset: 0;
      z-index: 8;
      overflow: hidden;
      pointer-events: none;
    }

    .spark {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 18px rgba(242, 179, 61, 0.7);
      animation: spark 620ms ease-out forwards;
      transform: rotate(var(--a)) translateX(0);
    }

    .unlock {
      position: absolute;
      inset: 0;
      z-index: 12;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(17, 20, 17, 0.72);
      backdrop-filter: blur(12px);
    }

    .unlock.show {
      display: grid;
    }

    .unlock-panel {
      width: min(430px, 100%);
      border: 1px solid rgba(255, 243, 214, 0.24);
      border-radius: 8px;
      padding: 24px;
      background:
        conic-gradient(from 0deg, rgba(242, 179, 61, 0.2), rgba(55, 183, 170, 0.16), rgba(220, 94, 116, 0.14), rgba(242, 179, 61, 0.2)),
        rgba(20, 23, 18, 0.95);
      text-align: center;
      box-shadow: 0 34px 80px rgba(0, 0, 0, 0.44);
    }

    .unlock-mandala {
      width: 190px;
      max-width: 72%;
      margin: 0 auto 14px;
      color: var(--gold);
      animation: slowSpin 16s linear infinite;
    }

    .unlock-title {
      margin: 0 0 4px;
      color: var(--paper);
      font-family: Georgia, "Noto Serif Devanagari", "Kohinoor Devanagari", serif;
      font-size: 3.2rem;
      line-height: 1;
    }

    .unlock-mantra {
      margin: 0 0 18px;
      color: var(--gold);
      font-family: Georgia, "Noto Serif Devanagari", "Kohinoor Devanagari", serif;
      font-size: 2.1rem;
      font-weight: 900;
    }

    @keyframes nudge {
      0%,
      100% {
        transform: translateX(0);
      }
      35% {
        transform: translateX(-5px);
      }
      70% {
        transform: translateX(5px);
      }
    }

    @keyframes spark {
      to {
        opacity: 0;
        transform: rotate(var(--a)) translateX(58px) scale(0.2);
      }
    }

    @keyframes slowSpin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 1080px) {
      .layout {
        grid-template-columns: 260px minmax(0, 1fr);
      }

      .side-panel {
        grid-column: 1 / -1;
        grid-template-columns: minmax(180px, 0.5fr) 1fr;
      }

      .stage {
        min-height: 590px;
      }
    }

    @media (max-width: 760px) {
      :root {
        --connect-board-size: clamp(304px, 86vw, 430px);
      }

      .app {
        padding: 14px;
      }

      .topbar {
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: start;
        gap: 10px;
      }

      .top-actions {
        flex-direction: column;
        gap: 8px;
      }

      .layout {
        display: flex;
        flex-direction: column;
      }

      .side-panel {
        grid-template-columns: 1fr;
      }

      .stage {
        order: -1;
        min-height: 430px;
      }

      .brand-mark {
        width: 56px;
        height: 56px;
        font-size: 1.32rem;
      }

      h1 {
        font-size: 2.05rem;
      }

      .connect-stage {
        padding: 16px;
      }

      .tile-grid {
        gap: 8px;
      }

      .tile {
        font-size: 1.55rem;
      }

      .mala-orbit {
        width: 214px;
      }

      .mala-beads span {
        transform: rotate(calc(var(--i) * 10deg)) translateY(-96px);
      }

      .mala-beads span.active {
        transform: rotate(calc(var(--i) * 10deg)) translateY(-96px) scale(1.16);
      }
    }

    @media (min-width: 900px) {
      .river-token {
        min-width: 104px;
        min-height: 54px;
        padding: 10px 17px 11px;
        font-size: 1.48rem;
      }

      .river-token::before {
        inset: -14px;
      }
    }
  </style>
</head>
<body>
  <main class="app" data-app data-mode="connect">
    <svg class="mandala-asset" viewBox="0 0 220 220" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="1.2">
        <circle cx="110" cy="110" r="91"></circle>
        <circle cx="110" cy="110" r="66"></circle>
        <circle cx="110" cy="110" r="35"></circle>
        <g>
          <path d="M110 18c18 26 18 52 0 78c-18-26-18-52 0-78Z"></path>
          <path d="M110 202c-18-26-18-52 0-78c18 26 18 52 0 78Z"></path>
          <path d="M18 110c26-18 52-18 78 0c-26 18-52 18-78 0Z"></path>
          <path d="M202 110c-26 18-52 18-78 0c26-18 52-18 78 0Z"></path>
        </g>
        <g transform="rotate(45 110 110)">
          <path d="M110 18c18 26 18 52 0 78c-18-26-18-52 0-78Z"></path>
          <path d="M110 202c-18-26-18-52 0-78c18 26 18 52 0 78Z"></path>
          <path d="M18 110c26-18 52-18 78 0c-26 18-52 18-78 0Z"></path>
          <path d="M202 110c-26 18-52 18-78 0c26-18 52-18 78 0Z"></path>
        </g>
      </g>
    </svg>

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" lang="hi">राम</div>
        <div>
          <h1>Mala Mantra</h1>
          <p class="target-line"><span class="target-pill" id="targetText" lang="hi">रा म</span><span>108</span></p>
        </div>
      </div>

      <div class="top-actions">
        <button class="icon-button" type="button" data-reset aria-label="Reset">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 3-6.7"></path>
            <path d="M3 4v6h6"></path>
          </svg>
        </button>
      </div>
    </header>

    <section class="layout">
      <aside class="panel mala-panel">
        <div class="mala-orbit" aria-label="Mala progress">
          <div class="mala-beads" id="malaBeads"></div>
          <div class="mala-center">
            <div>
              <div class="mala-count" id="beadMini">0</div>
              <div class="mala-label">Mala</div>
            </div>
          </div>
        </div>

        <div class="stat-stack">
          <div class="stat-row"><span>Beads</span><strong id="beadText">0 / 108</strong></div>
          <div class="meter" aria-hidden="true"><span id="malaFill"></span></div>
          <div class="stat-row"><span>Mandala</span><strong id="ringText">0 / 4</strong></div>
        </div>

        <div class="mode-tabs" role="group" aria-label="Mode">
          <button class="mode-button active" type="button" data-mode="connect" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6h.01M18 6h.01M6 18h.01M18 18h.01"></path>
              <path d="M6 6l12 12M18 6L6 18"></path>
            </svg>
            <span>Connect</span>
          </button>
          <button class="mode-button" type="button" data-mode="river" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7c4-3 8 3 12 0c2-1 3-2 4-2"></path>
              <path d="M4 13c4-3 8 3 12 0c2-1 3-2 4-2"></path>
              <path d="M4 19c4-3 8 3 12 0c2-1 3-2 4-2"></path>
            </svg>
            <span>River</span>
          </button>
        </div>
      </aside>

      <section class="stage" id="stage" aria-label="Mala Mantra game">
        <div class="connect-stage">
          <div class="grid-wrap" id="gridWrap">
            <svg class="path-svg" aria-hidden="true">
              <polyline class="path-glow" id="pathGlow"></polyline>
              <polyline class="path-line" id="pathLine"></polyline>
            </svg>
            <div class="tile-grid" id="tileGrid"></div>
          </div>
        </div>

        <div class="river-stage" id="riverStage" style="--calm: 42">
          <svg class="river-art" viewBox="0 0 900 650" preserveAspectRatio="none" aria-hidden="true">
            <path d="M70 0C150 88 40 132 150 218C260 304 120 372 230 474C310 548 260 602 330 650"></path>
            <path d="M360 0C430 100 300 152 430 254C545 344 390 426 520 520C600 578 560 620 640 650"></path>
            <path d="M680 0C730 78 655 154 760 238C850 310 730 396 815 486C860 532 840 604 884 650"></path>
          </svg>
        </div>

        <div class="burst-layer" id="burstLayer" aria-hidden="true"></div>

        <div class="unlock" id="unlock" aria-hidden="true">
          <div class="unlock-panel">
            <svg class="unlock-mandala" viewBox="0 0 220 220" aria-hidden="true">
              <g fill="none" stroke="currentColor" stroke-width="1.4">
                <circle cx="110" cy="110" r="94"></circle>
                <circle cx="110" cy="110" r="72"></circle>
                <circle cx="110" cy="110" r="48"></circle>
                <circle cx="110" cy="110" r="19"></circle>
                <g>
                  <path d="M110 16c20 30 20 60 0 90c-20-30-20-60 0-90Z"></path>
                  <path d="M110 204c-20-30-20-60 0-90c20 30 20 60 0 90Z"></path>
                  <path d="M16 110c30-20 60-20 90 0c-30 20-60 20-90 0Z"></path>
                  <path d="M204 110c-30 20-60 20-90 0c30-20 60-20 90 0Z"></path>
                </g>
                <g transform="rotate(45 110 110)">
                  <path d="M110 16c20 30 20 60 0 90c-20-30-20-60 0-90Z"></path>
                  <path d="M110 204c-20-30-20-60 0-90c20 30 20 60 0 90Z"></path>
                  <path d="M16 110c30-20 60-20 90 0c-30 20-60 20-90 0Z"></path>
                  <path d="M204 110c-30 20-60 20-90 0c30-20 60-20 90 0Z"></path>
                </g>
              </g>
            </svg>
            <h2 class="unlock-title">108</h2>
            <p class="unlock-mantra" lang="hi">राम</p>
            <button class="reset-button" type="button" data-reset>Restart</button>
          </div>
        </div>
      </section>

      <aside class="panel side-panel">
        <div class="mantra-card" lang="hi">राम</div>
        <div class="mini-stats">
          <div class="mini-stat"><span>Calm</span><strong id="calmText">42</strong></div>
          <div class="meter" aria-hidden="true"><span id="calmFill"></span></div>
          <div class="mini-stat"><span>Streak</span><strong id="streakText">0</strong></div>
          <button class="reset-button" type="button" data-reset>Reset</button>
        </div>
      </aside>
    </section>
  </main>

  <script src="mantra-connect-game.js"></script>
</body>
</html>
